name: teen_chat_app
description: "TeenChat - A teen-focused social chat app with mood tracking and community feed"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🌐 Backend (Firebase)
  firebase_core: ^2.30.0
  cloud_firestore: ^4.15.0
  firebase_auth: ^4.17.0

  # 📡 Connectivity
  connectivity_plus: ^6.0.3

  # 💾 Local storage
  shared_preferences: ^2.2.3

  # 🆔 IDs
  uuid: ^4.4.2

  # ✨ Animations
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true